  "/v1/mapping-requests/{mapping_request_id}/fail":
    post:
      operationId: "failMappingRequest"
      tags:
        - "mappings"
      summary: "Report that no passing mapping was built"
      description: "Closes an `open` request as `failed` and counts one repair. Repeating it on a `failed` request returns it unchanged (200); on `resolved`, `expired` or `cancelled` → 409 `mapping_request_closed`."
      parameters:
        - "$ref": "#/components/parameters/mapping_request_id"
