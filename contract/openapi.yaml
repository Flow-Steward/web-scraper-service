  "/v1/admin/storage":
    get:
      operationId: "getStorage"
      tags:
        - "admin"
      summary: "Added 2026-11-14. Disk use of the data volume, retention and the last clean-ups"
      description: "Bytes, item counts and the oldest item per kind (run working files, result files, samples, protection screenshots, database + WAL + SHM, identities, other), runs by state, the retention settings, total/free bytes of the volume, and the last automatic and manual clean-ups. No per-file lists. Read-only (README 16.1)."
      responses:
        "200":
          description: "Storage"
          content:
            "application/json":
              schema:
                "$ref": "./schemas/storage.schema.json"
              examples:
                get_admin_storage_response:
                  externalValue: "./examples/get_admin_storage.response.json"
        default:
          "$ref": "#/components/responses/error"
      x-error-codes:
        - "internal_error"
        - "unauthorized"
  "/v1/admin/cleanup":
    post:
      operationId: "cleanUp"
      tags:
        - "admin"
      summary: "Added 2026-11-14. Remove finished runs' files and records, samples, screenshots; compact the database"
      description: "`dry_run` defaults to true: the answer says what would be removed and how many bytes. Never touches a run that is not finished, `identities.json`, unknown files, or a result file the platform has not fetched yet unless `include_unfetched` is true. Compaction: WAL checkpoint always, VACUUM only when no run is active (else `skipped` with the reason). Serialised with the automatic sweeper (README 16.2, 16.3)."
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              "$ref": "./schemas/cleanup.schema.json#/$defs/cleanup_request"
            examples:
              post_admin_cleanup_request:
                externalValue: "./examples/post_admin_cleanup.request.json"
      responses:
        "200":
          description: "What was removed (or, in a dry run, would be)"
          content:
            "application/json":
              schema:
                "$ref": "./schemas/cleanup.schema.json"
              examples:
                post_admin_cleanup_response_dry_run:
                  summary: "Dry run (the default)"
                  externalValue: "./examples/post_admin_cleanup.response.dry_run.json"
                post_admin_cleanup_response:
                  summary: "Applied; VACUUM skipped because a run is active"
                  externalValue: "./examples/post_admin_cleanup.response.json"
        default:
          "$ref": "#/components/responses/error"
      x-error-codes:
        - "internal_error"
        - "invalid_json"
        - "request_too_large"
        - "unauthorized"
        - "unsupported_media_type"
        - "validation_failed"
webhooks:
  scraper_event:
    post:
      operationId: "deliverEvent"
      summary: "Event delivery to the `Scraper events` workflow's signed webhook"
      description: "Signed as described in README \"Webhook signing\". Accepted = any 2xx. Everything else is retried on the schedule in `GET /health` `webhook_delivery`."
      security: []
      parameters:
        - name: "X-Scraper-Signature"
          in: "header"
          required: true
          description: "Lower-case hex HMAC-SHA256 of `timestamp + \".\" + raw body`."
          schema:
            type: "string"
            pattern: "^[0-9a-f]{64}$"
        - name: "X-Scraper-Body-Signature"
          in: "header"
          required: false
          description: "Added 2026-11-13. `sha256=` + lower-case hex HMAC-SHA256 of the raw body only (no timestamp), for the platform's older signed-webhook mode. Sent on every delivery next to `X-Scraper-Signature`."
          schema:
            type: "string"
            pattern: "^sha256=[0-9a-f]{64}$"
        - name: "X-Scraper-Timestamp"
          in: "header"
          required: true
          description: "Unix time in seconds at this attempt."
          schema:
            type: "string"
            pattern: "^[0-9]{10}$"
        - name: "Idempotency-Key"
          in: "header"
          required: true
          description: "`<event_id>.<delivery_generation>`; equal on every attempt of one generation."
          schema:
            type: "string"
            pattern: "^evt_[A-Za-z0-9]{1,64}\\.[0-9]+$"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./schemas/event.schema.json"
            examples:
              run_completed:
                externalValue: "./examples/webhook_event.request.json"
      responses:
        "2XX":
          description: "Accepted"
        default:
          description: "Not accepted; retried"
components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      description: "The service token of the `scraper_profile` connection."
  parameters:
    run_id:
      name: "run_id"
      in: "path"
      required: true
      schema:
        "$ref": "./schemas/run_summary.schema.json#/$defs/run_id"
    event_id:
      name: "event_id"
      in: "path"
      required: true
      schema:
        "$ref": "./schemas/run_summary.schema.json#/$defs/event_id"
    mapping_request_id:
      name: "mapping_request_id"
      in: "path"
      required: true
      schema:
        "$ref": "./schemas/run_summary.schema.json#/$defs/mapping_request_id"
    site:
      name: "site"
      in: "path"
      required: true
      description: "Site key (README \"Site key\")."
      schema:
        "$ref": "./schemas/run_summary.schema.json#/$defs/site"
    cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "Opaque `next_cursor` of the previous page; valid 24 h."
      schema:
        type: "string"
        maxLength: 512
    limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
    idempotency_key:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "`fs:<platform job id>:<step id>` or `fs:<job id>:<step id>:<loop position>`."
      schema:
        "$ref": "./schemas/run_summary.schema.json#/$defs/idempotency_key"
  headers:
    ETag:
      schema:
        type: "string"
        pattern: "^\"[0-9a-f]{64}\"$"
      description: "Quoted SHA-256 hex of the whole file."
    Content-Disposition:
      schema:
        type: "string"
      description: "`attachment; filename=\"<file_name>\"`."
    Accept-Ranges:
      schema:
        type: "string"
        const: "bytes"
    Repr-Digest:
      schema:
        type: "string"
      description: "RFC 9530: `sha-256=:<base64 of the SHA-256>:` of the whole file."
  responses:
    error:
      description: "Any 4xx/5xx. `code` is in `schemas/error.schema.json`; see `x-error-codes` of the operation."
      content:
        "application/json":
          schema:
            "$ref": "./schemas/error.schema.json"
